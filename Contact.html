<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакти | Кам'янець-Подільський</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="logo">Кам'янець</div>
            <nav class="nav">
                <a href="index.html">Головна</a>
                <a href="reminders.html">Пам'ятки</a>
                <a href="Contact.html" class="active">Контакти</a>
            </nav>
        </header>

        <main class="container contact-page">
            <section class="contact-layout">
                <div class="contact-info">
                    <p class="eyebrow">Офіс туристичного центру</p>
                    <h1>Зв'яжіться з нами</h1>
                    <p>Email: office@kamenets-tour.ua</p>
                    <p>Телефон: +380 44 201 77 11</p>
                    <p>Мобільний: +380 97 444 88 00</p>
                    <p>Адреса: м. Кам'янець-Подільський, вул. Шевченка 15</p>
                </div>

                <form class="contact-form">
                    <label for="name">Ім'я</label>
                    <input type="text" id="name" placeholder="Ваше ім'я">

                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="example@gmail.com">

                    <label for="message">Повідомлення</label>
                    <textarea id="message" rows="5" placeholder="Напишіть, який маршрут або гіда ви хочете забронювати..."></textarea>

                    <button type="submit" class="btn primary">Відправити</button>
                </form>
            </section>
        </main>

        <footer class="site-footer">
            <p>&copy; 2026 Кам'янець-Подільський</p>
        </footer>
    </div>
</body>
</html>
